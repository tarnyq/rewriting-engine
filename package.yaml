name:                kmonad
version:             0.1.0.0
github:              nishantjr/kmonad
license:             AllRightsReserved
author:
    - "Nishant Rodrigues <nishantjr@gmail.com>"
    - "Curt J. Sampson <cjs@cynic.net>"
copyright:  2025 Nishant Rodrigues and Curt Sampson
category:   Programming Languages
synopsis:   A proof-of-concept reimplementation of K as a Haskell library.
description: See the README for more details.

extra-source-files:
- README.md

dependencies:
- base >= 4.7 && < 5

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src

executables:
  kmonad-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - kmonad

tests:
  kmonad-test:
    main:                Spec.hs
    source-dirs:         unit-test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - kmonad
