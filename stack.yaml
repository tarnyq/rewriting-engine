#   https://docs.haskellstack.org/en/stable/configure/yaml/

#   Liquid Haskell requires a specific point version of GHC[1], probably
#   due to its dependency on some GHC internals that breaks it with certain
#   internal changes. We always want to use the latest LTS, but may be
#   required to back down to a previous GHc point release, as here (9.8.2
#   instead of 9.8.4).
#   [1]: https://ucsd-progsys.github.io/liquidhaskell/install/
resolver: lts-23.24         # Includes GHC version as well as library verisons.
compiler: ghc-9.8.2

packages:
- .

extra-deps:
- liquidhaskell-0.9.8.2
- liquidhaskell-boot-0.9.8.2
- liquid-fixpoint-0.9.6.3.1@sha256:c55faa535c067479877dd2ae997c24c7e54ec4e86666407bc799759760a73ef0,9507
- smtlib-backends-0.4@sha256:a662fecbc8908337b8f19d9bb7e1515a29f4dd992a5eb88f1fcb59e6ab1d0871,1258
- smtlib-backends-process-0.3@sha256:1cdd2ae8ebf3786f08cafe2f6b47001f7647779ad87cba3f05250f68d70e3f07,1676

#   This avoids annoying warnings if you happen to have Nix in your path.
#   (We don't use Nix. Bleh.)
notify-if-nix-on-path: false
